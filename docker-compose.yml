# Ejecución local en un solo contenedor (UI + API).
#   1) docker compose run --rm init     -> crea backend/.env con credenciales seguras
#   2) docker compose up --build        -> http://localhost:8080
services:
  app:
    build: .
    image: onboarding-agentico:local
    ports:
      - "127.0.0.1:8080:8080"          # solo accesible desde esta máquina
    env_file:
      - backend/.env                    # secretos inyectados en runtime, nunca en la imagen
    environment:
      DATABASE_PATH: /tmp/onboarding.db
      CORS_ORIGINS: http://localhost:8080
    read_only: true                     # sistema de archivos inmutable
    tmpfs:
      - /tmp                            # único lugar escribible (SQLite)
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8080/api/v1/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  init:
    profiles: [setup]
    build: .
    image: onboarding-agentico:local
    user: root
    volumes:
      - ./backend:/out
    command: ["python", "-m", "app.core.init_env", "/out/.env"]
    network_mode: none
